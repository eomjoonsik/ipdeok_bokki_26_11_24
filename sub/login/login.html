
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입덕볶이 | 로그인</title>
    <link rel="stylesheet" href="../../CSS/style.css">
    <link rel="stylesheet" href="CSS/login.css">
<script src="../../JS/auth.js"></script>
</head>
<body>

<div class="wrap">

    <header class="header">
        <a href="../../index.html" class="logo">
            <img src="../../img/logo.png" alt="입덕볶이">
        </a>

        <input type="checkbox" id="menu-toggle" class="menu-toggle">

        <label for="menu-toggle" class="menu-btn">
            <svg width="24" height="24" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round">
                <path d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </label>

        <label for="menu-toggle" class="menu-overlay"></label>

        <nav class="side-menu">
            <div class="side-menu-header">
                <h2>메뉴</h2>
                <label for="menu-toggle" class="close-btn">✕</label>
            </div>

                <ul class="side-menu-list">
                <li><a href="../about/about.html">소개</a></li>
                <li><a href="../community/community.html">커뮤니티</a></li>
                <li><a href="../login/login.html">로그인</a></li>
                </ul>
        </nav>
    </header>

    <main class="login-main">
<p style="font-size:12px;color:#786456">체험용 계정만 사용해 주세요. 실제 개인정보 및 비밀번호 입력 금지.</p>

        <section class="login-heading">
            <img src="../../img/logo.png" alt="입덕볶이">
            <span>WELCOME BACK!</span>
            <h1>오늘도 입덕할 준비<span>?</span></h1>
            <p>로그인하고 입덕볶이의 다양한 혜택을 만나보세요.</p>
        </section>

        <form class="login-form" id="login-form">

            <div id="signup-fields" hidden><label for="user-name">이름</label><input id="user-name" placeholder="테스트용 이름" maxlength="20"></div>
            <label for="user-id">아이디</label>
            <input type="text" id="user-id"
                placeholder="아이디를 입력해 주세요"
                autocomplete="username" required>

            <label for="user-password">비밀번호</label>

            <div class="password-box">
                <input type="password" id="user-password"
                    placeholder="비밀번호를 입력해 주세요"
                    autocomplete="current-password" required>

                <button type="button" id="password-toggle">
                    보기
                </button>
            </div>

            <div class="login-options">
                <label>
                    <input type="checkbox" id="remember-id">
                    아이디 기억하기
                </label>
            </div>

            <button type="submit" class="login-btn">
                로그인
            </button>

        </form>

        <div class="account-links">
            <button type="button" class="demo-btn">아이디 찾기</button>
            <span></span>
            <button type="button" class="demo-btn">비밀번호 찾기</button>
            <span></span>
            <button type="button" class="signup-btn">회원가입</button>
        </div>

        <div class="social-divider">
            <span></span>
            <p>간편 로그인</p>
            <span></span>
        </div>

        <div class="social-login">

            <button class="kakao-btn demo-btn" type="button">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 3C6 3 2 6.5 2 10.5c0 2.6 1.8 4.9 4.6 6.2L5.5 21l5-3.2c.5.1 1 .2 1.5.2 6 0 10-3.5 10-7.5S18 3 12 3z"/>
                </svg>
                카카오로 시작하기
            </button>

            <button class="naver-btn demo-btn" type="button">
                <strong>N</strong>
                네이버로 시작하기
            </button>

        </div>

        <section class="login-event">
            <span>WELCOME COUPON</span>
            <h2>첫 입덕을 환영해!</h2>
            <p>신규 회원 5,000원 할인 혜택</p>
            <button class="signup-btn" type="button">회원가입하기 ↗</button>
        </section>

    </main>

</div>

<script>
const password = document.querySelector('#user-password');
const toggle = document.querySelector('#password-toggle');
const idInput = document.querySelector('#user-id');
const nameInput = document.querySelector('#user-name');
let signup = false;
idInput.value = localStorage.getItem('ipdeokRememberId') || '';
document.querySelector('#remember-id').checked = !!idInput.value;
toggle.onclick = () => { password.type = password.type === 'password' ? 'text' : 'password'; toggle.textContent = password.type === 'password' ? '보기' : '숨기기'; };
document.querySelectorAll('.signup-btn').forEach(b => b.onclick = () => {
 signup = !signup;
 document.querySelector('#signup-fields').hidden = !signup;
 nameInput.required = signup;
 document.querySelector('.login-btn').textContent = signup ? '회원가입 완료' : '로그인';
 document.querySelector('.login-heading h1').textContent = signup ? '첫 입덕을 환영해!' : '오늘도 입덕할 준비?';
 document.querySelectorAll('.signup-btn').forEach(x => x.textContent = signup ? '로그인으로 돌아가기' : '회원가입');
});
document.querySelector('#login-form').onsubmit = e => {
 e.preventDefault();
 const id = idInput.value.trim(); const pw = password.value; const users = Auth.users();
 if (!id || !pw) return alert('아이디와 비밀번호를 입력해 주세요.');
 if (signup) {
  if (!nameInput.value.trim()) return alert('이름을 입력해 주세요.');
  if (users.some(u => u.id === id)) return alert('이미 가입된 아이디입니다.');
  users.push({id, name:nameInput.value.trim(), password:pw, joined:Date.now()});
  localStorage.setItem('ipdeokUsers', JSON.stringify(users));
 } else if (!users.some(u => u.id === id && u.password === pw)) return alert('아이디 또는 비밀번호를 확인해 주세요.');
 localStorage.setItem('ipdeokUser',id);
 if(document.querySelector('#remember-id').checked) localStorage.setItem('ipdeokRememberId',id); else localStorage.removeItem('ipdeokRememberId');
 const back = sessionStorage.getItem('ipdeokReturn'); sessionStorage.removeItem('ipdeokReturn');
 location.href = back && back.startsWith(Auth.root.href) ? back : '../../index.html';
};
document.querySelectorAll('.demo-btn').forEach(b => b.onclick = () => alert('현재 준비 중인 기능입니다.'));
</script>
</body></html>
