<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입덕볶이 | 메뉴</title>
    <link rel="stylesheet" href="../../CSS/style.css">
    <link rel="stylesheet" href="CSS/lists.css">
<script src="../../JS/auth.js"></script>
</head>
<body>

<div class="wrap">

    <header class="header">
        <a href="../../index.html" class="logo">
            <img src="../../img/logo.png" alt="입덕볶이">
        </a>

        <input type="checkbox" id="menu-toggle" class="menu-toggle">

        <label for="menu-toggle" class="menu-btn">
            <svg width="24" height="24" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 6h16"/>
                <path d="M4 12h16"/>
                <path d="M4 18h16"/>
            </svg>
        </label>

        <label for="menu-toggle" class="menu-overlay"></label>

        <nav class="side-menu">
            <div class="side-menu-header">
                <h2>메뉴</h2>

                <label for="menu-toggle" class="close-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="m18 6-12 12"/>
                        <path d="m6 6 12 12"/>
                    </svg>
                </label>
            </div>

            <ul class="side-menu-list">
                <li><a href="../about/about.html">소개</a></li>
                <li><a href="../community/community.html">커뮤니티</a></li>
                <li><a href="../login/login.html">로그인</a></li>
            </ul>
        </nav>
    </header>

    <main class="lists-main">

        <section class="list-hero">
            <small>IPDEOK BOKKI / MENU COLLECTION</small>
            <h1>당신의 최애는?</h1>
            <p>취향대로 골라보는 19가지 메뉴.</p>
        </section>
        <a href="../payment/payment.html" class="cart-link">
         장바구니 확인하기 ↗
        </a>
        <div class="category-wrap">
            <button data-cat="떡볶이" class="active">떡볶이</button>
            <button data-cat="세트메뉴">세트메뉴</button>
            <button data-cat="사이드">사이드</button>
        </div>

        <div class="address-box">
            <span id="address">기본배달지를 등록해 주세요</span>
            <button id="address-btn">등록 ↗</button>
        </div>

        <section class="test-banner">
            <small>SECRET COLLECTION / TYPE A–D</small>
            <h2>나와 맞는 조합은?</h2>
            <p>근본 · 말랑 · 얼얼 · 단짠</p>
            <button onclick="location.href='../typetest/typetest.html'">
    운명의 최애 찾기 ↗
</button>
        </section>

        <div class="list-heading">
            <h2 id="category-title">떡볶이</h2>
            <span id="count"></span>
        </div>

        <div class="filters">
            <button id="favorites" aria-pressed="false">
                ♡ 최애만 보기
            </button>

            <select id="sort" aria-label="메뉴 정렬">
                <option value="popular">인기순</option>
                <option value="low">낮은 가격순</option>
                <option value="high">높은 가격순</option>
            </select>
        </div>

        <div id="products" class="product-grid"></div>

    </main>
</div>

<script>

const groups = {
    "떡볶이": [
        ["오리지널 떡볶이", 9000, "매콤달콤 센터", 14000],
        ["로제 떡볶이", 11000, "부드러운 매력", 16000],
        ["마라 떡볶이", 12000, "얼얼한 존재감", 17000],
        ["짜장 떡볶이", 9000, "달콤한 반전", 14000],
        ["크림 떡볶이", 11000, "고소한 매력", 16000],
        ["치즈 떡볶이", 10000, "치즈 듬뿍", 15000]
    ],

    "세트메뉴": [
        ["근본 세트", 18000, "오리지널 + 김말이 + 튀김만두"],
        ["말랑 세트", 22000, "로제 + 치즈볼 + 감자튀김"],
        ["얼얼 세트", 23000, "마라 + 중국당면 + 순살치킨"],
        ["단짠 세트", 19500, "치즈 + 핫도그 + 주먹밥"]
    ],

    "사이드": [
        ["김말이", 3000, "바삭한 한입"],
        ["튀김만두", 3000, "떡볶이 단짝"],
        ["치즈볼", 4000, "쭉 늘어나는 치즈"],
        ["감자튀김", 4000, "바삭하고 짭짤한"],
        ["순살치킨", 6000, "든든한 한입"],
        ["설탕 듬뿍 핫도그", 3000, "달콤 바삭"],
        ["주먹밥", 3500, "고소한 한입"],
        ["모둠튀김", 5000, "골고루 즐기는"],
        ["중국당면", 2000, "쫄깃한 식감"]
    ]
};

const prefixes = {
    "떡볶이": "list",
    "세트메뉴": "set",
    "사이드": "side"
};

const colors = [
    "#FFBC85",
    "#FFB2A1",
    "#D99780",
    "#E7C79D",
    "#F5DDB0",
    "#FFD45C"
];

let cat = "떡볶이";
let only = false;
let fav = [];

try {
    fav = JSON.parse(Auth.get("ipdeokFavorites") || "[]");

    if (!Array.isArray(fav)) {
        fav = [];
    }
} catch {}

const $ = id => document.getElementById(id);
const money = n => n.toLocaleString("ko-KR") + "원";

function render() {

    let items = groups[cat].map((v, i) => ({
        v,
        i,
        key: prefixes[cat] + (i + 1)
    }));

    if (only) {
        items = items.filter(x => fav.includes(x.key));
    }

    if ($("sort").value === "low") {
        items.sort((a, b) => a.v[1] - b.v[1]);
    }

    if ($("sort").value === "high") {
        items.sort((a, b) => b.v[1] - a.v[1]);
    }

    $("category-title").textContent = cat;
    $("count").textContent = `총 ${items.length}개 메뉴`;

    $("products").innerHTML = items.map(({v, i, key}) => `

        <article class="product-card">

            <div class="card-top">
                <small>
                    ${cat === "세트메뉴"
                        ? "TYPE " + "ABCD"[i]
                        : "PROFILE / " + String(i + 1).padStart(2, "0")}
                </small>

                <button class="heart"
                    data-key="${key}"
                    aria-label="${v[0]} 최애 저장"
                    aria-pressed="${fav.includes(key)}">
                    ${fav.includes(key) ? "♥" : "♡"}
                </button>
            </div>

            <div class="food-photo"
                style="background:${colors[i % colors.length]}">
                <img src="img/${key}.png" alt="${v[0]}">
            </div>

            <h3>${v[0]}</h3>
            <p>${v[2]}</p>

            <div class="price">
                ${v[3] ? "1인분 " : ""}
                ${money(v[1])}
                ${v[3] ? "<br>2인분 " + money(v[3]) : ""}
            </div>

            <a class="detail-link"
                href="../detail/detail.html?id=${key}">
                메뉴 보기 ↗
            </a>

        </article>

    `).join("") || '<p class="empty">저장한 최애 메뉴가 없어요.</p>';
}

document.querySelectorAll("[data-cat]").forEach(b => {

    b.onclick = () => {

        cat = b.dataset.cat;

        document.querySelectorAll("[data-cat]").forEach(x => {
            x.classList.toggle("active", x === b);
        });

        render();
    };
});

$("sort").onchange = render;

$("favorites").onclick = () => {
    if (!Auth.user()) { if(confirm("로그인 후 최애를 저장할 수 있어요. 로그인할까요?")) Auth.login(); return; }
    only = !only;
    $("favorites").setAttribute("aria-pressed", only);
    render();
};

$("products").onclick = e => {

    const b = e.target.closest("[data-key]");

    if (!b) return;

    if (!Auth.user()) { if(confirm("로그인 후 최애를 저장할 수 있어요. 로그인할까요?")) Auth.login(); return; }
    const k = b.dataset.key;

    fav = fav.includes(k)
        ? fav.filter(x => x !== k)
        : [...fav, k];

    Auth.save("ipdeokFavorites", JSON.stringify(fav));

    render();
};

$("address").textContent =
    Auth.get("ipdeokAddress")
    || "기본배달지를 등록해 주세요";

$("address-btn").onclick = () => {

    const a = prompt(
        "배달 주소를 입력해 주세요",
        Auth.get("ipdeokAddress") || ""
    );

    if (a && a.trim()) {
        Auth.save("ipdeokAddress", a.trim());
        $("address").textContent = a.trim();
    }
};

if (new URLSearchParams(location.search).get("category") === "set") {
    cat = "세트메뉴";

    document.querySelectorAll("[data-cat]").forEach(button => {
        button.classList.toggle(
            "active",
            button.dataset.cat === cat
        );
    });
}



render();

document.getElementById("products").addEventListener("click", function(e) {

    const photo = e.target.closest(".food-photo");

    if (!photo) return;

    const card = photo.closest(".product-card");
    const link = card.querySelector(".detail-link");

    if (link && link.href) {
        window.location.href = link.href;
    }

});


</script>

</body>
</html>
