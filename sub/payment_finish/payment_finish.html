<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입덕볶이 | 주문 완료</title>
    <link rel="stylesheet" href="../../CSS/style.css">
    <link rel="stylesheet" href="CSS/payment_finish.css">
</head>
<body>

<div class="wrap">

    <header class="header">

        <a href="../../index.html" class="logo">
            <img src="../../img/logo.png" alt="입덕볶이">
        </a>

        <input type="checkbox" id="menu-toggle" class="menu-toggle">

        <label for="menu-toggle" class="menu-btn">
            <svg width="24" height="24" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round">
                <path d="M4 6h16"/>
                <path d="M4 12h16"/>
                <path d="M4 18h16"/>
            </svg>
        </label>

        <label for="menu-toggle" class="menu-overlay"></label>

        <nav class="side-menu">

            <div class="side-menu-header">
                <h2>메뉴</h2>
                <label for="menu-toggle" class="close-btn">✕</label>
            </div>

            <ul class="side-menu-list">
                <li><a href="../about/about.html">소개</a></li>
                <li><a href="../community/community.html">커뮤니티</a></li>
                <li><a href="../login/login.html">로그인</a></li>
            </ul>

        </nav>

    </header>

    <main class="finish-main">

        <section class="order-ticket">

            <div class="ticket-top">
                <span>IPDEOK BOKKI</span>
                <span>NO. 2026</span>
            </div>

            <small>YOUR FIRST BITE</small>

            <h1>입덕 완료!</h1>

            <div class="cupid-stage" id="cupid-stage" aria-hidden="true">
                <img class="cupid-fly" src="img/cupid.png" alt="">
                <span class="cupid-arrow">➳</span>
                <img class="cupid-bowl" src="img/bowl.png" alt="">
                <img class="cupid-heart" src="img/heart-bowl.png" alt="">
                <img class="cupid-final" src="img/celebrate.png" alt="">
            </div>

            <p>오늘의 최애가 곧 찾아갑니다.</p>

            <div class="ticket-number">
                <span>ORDER NUMBER</span>
                <strong id="order-number">-</strong>
            </div>

            <div class="ticket-bottom">
                LUCKY DAY! LUCKY BITE!
            </div>

        </section>

        <div id="order-content">

            <section class="delivery-time">

                <div class="delivery-time-title">
                    예상 배달 소요 시간
                </div>

                <strong id="order-time">40~50분</strong>

                <p>매장 상황에 따라 달라질 수 있어요.</p>

            </section>

            <section class="order-progress">

                <h2>주문 진행 상태</h2>

                <div class="progress-steps">
                    <span class="current">주문 접수</span>
                    <span>조리 중</span>
                    <span>배달 중</span>
                    <span>배달 완료</span>
                </div>

            </section>

            <section class="delivery-info">

                <h2>배달 주소</h2>

                <p id="finish-address"></p>

                <p id="finish-detail"></p>

                <div class="delivery-divider"></div>

                <h2>배달 요청사항</h2>

                <p id="finish-request"></p>

            </section>

            <section class="finish-products">

                <h2>주문 내역</h2>

                <div id="ordered-products"></div>

                <div class="finish-total">
                    <span>최종 결제 금액</span>
                    <strong id="ordered-total"></strong>
                </div>

                <p id="ordered-method"></p>

            </section>

        </div>

        <a href="../../index.html" class="home-btn">
            홈으로 돌아가기 ↗
        </a>

    </main>

</div>

<script>

const $ = id => document.getElementById(id);

let order = null;

try {
    order = JSON.parse(
        sessionStorage.getItem("ipdeokOrder") || "null"
    );
} catch {
    order = null;
}

if (order && Array.isArray(order.products)) {

    $("order-number").textContent = order.number;

    $("order-time").textContent = order.time;

    $("finish-address").textContent = order.address;

    $("finish-detail").textContent = order.detail;

    $("finish-request").textContent = order.request;

    $("ordered-total").textContent =
        order.total.toLocaleString("ko-KR") + "원";

    $("ordered-method").textContent =
        "결제 수단 : " + order.method;

    order.products.forEach(product => {

        const item = document.createElement("div");

        item.className = "ordered-item";

        const info = document.createElement("div");

        const name = document.createElement("span");

        name.textContent =
            product.name + " × " + product.quantity;

        info.appendChild(name);

        const options = [];

        if (product.portion) {
            options.push(product.portion + "인분");
        }

        if (product.spicy) {
            options.push(product.spicy);
        }

        if (product.toppings && product.toppings.length) {
            options.push(product.toppings.join(", "));
        }

        if (options.length) {
            const description = document.createElement("p");
            description.className = "ordered-options";
            description.textContent = options.join(" / ");
            info.appendChild(description);
        }

        const price = document.createElement("strong");

        price.textContent =
            (product.price * product.quantity)
                .toLocaleString("ko-KR") + "원";

        item.append(info, price);

        $("ordered-products").appendChild(item);
    });

} else {

    document.querySelector(".order-ticket h1").textContent =
        "주문 내역 없음";

    document.querySelector(".order-ticket p").textContent =
        "아직 완료된 주문이 없어요.";

    $("order-content").hidden = true;
}

</script>

<script src="JS/payment_finish.js"></script>

</body>
</html>
